[project]
name = "vla-bc-policy-temporal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tonyddg", email = "799052200@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.1",
    "numpy>=1.22.4,<2.0.0",
    "tyro>=0.9.5",
    "lightning>=2.6.4",
    "setuptools<82",
]

[project.scripts]
vla-bc-policy-temporal = "vla_bc_policy_temporal:main"

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[project.optional-dependencies]
train = [
    "rich>=14.0.0",
    "lerobot",
    "datasets==3.6.0",
    "h5py>=3.16.0",
    "optuna>=4.8.0",
    "optuna-integration>=4.8.0",
    "tensorboard>=2.20.0",
    "matplotlib>=3.10.9",
    "dotenv>=0.9.9",
    "scikit-learn>=1.7.2",
]
